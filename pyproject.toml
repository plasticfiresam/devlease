[project]
name = "devlease"
version = "0.0.1"
description = "A machine-wide lease registry for iOS simulators and Android emulators shared by coding agents"
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devlease = "devlease.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devlease"]
